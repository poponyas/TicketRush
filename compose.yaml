services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticketrush}
      POSTGRES_USER: ${POSTGRES_USER:-ticketrush}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketrush_dev}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
      image: redis:8.10.3-alpine
      ports:
        - "127.0.0.1:6380:6379"
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 5s
        timeout: 3s
        retries: 5

  clickhouse:
    image: clickhouse:26.9.27.3
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-ticketrush}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-ticketrush}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-ticketrush_dev}
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --host \"$$(hostname -i)\" --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --database \"$$CLICKHOUSE_DB\" --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.3
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    entrypoint:
      - migrate
      - -path
      - /migrations
      - -database
      - "${MIGRATE_DATABASE_URL:-postgres://${POSTGRES_USER:-ticketrush}:${POSTGRES_PASSWORD:-ticketrush_dev}@postgres:5432/${POSTGRES_DB:-ticketrush}?sslmode=disable}"
    command: ["up"]

  migrate-clickhouse:
    image: migrate/migrate:v4.18.3
    profiles: ["tools"]
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./clickhouse/migrations:/migrations:ro
    entrypoint:
      - migrate
      - -path
      - /migrations
      - -database
      - "${CLICKHOUSE_MIGRATE_DATABASE_URL:-clickhouse://clickhouse:9000?username=${CLICKHOUSE_USER:-ticketrush}&password=${CLICKHOUSE_PASSWORD:-ticketrush_dev}&database=${CLICKHOUSE_DB:-ticketrush}&x-multi-statement=true}"
    command: ["up"]

  kafka:
      image: apache/kafka:4.4.0
      environment:
        KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
        KAFKA_NODE_ID: 1
        KAFKA_PROCESS_ROLES: broker,controller
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
        KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      ports:
        - "127.0.0.1:9092:9092"
      volumes:
        - kafka_data:/tmp/kraft-combined-logs
      healthcheck:
        test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
        interval: 10s
        timeout: 10s
        retries: 12
        start_period: 15s

  s3:
    image: ghcr.io/chrislusf/seaweedfs:4.53
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-ticketrush}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-ticketrush_dev}
      S3_BUCKET: ${S3_BUCKET:-ticketrush-posters}
    ports:
      - "127.0.0.1:9002:8333"
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/dir/status"]
      interval: 5s
      timeout: 5s
      retries: 12


  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.22.0
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"

  prometheus:
    image: prom/prometheus:v3.14.0
    network_mode: host
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.listen-address=127.0.0.1:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:13.2.2
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: "127.0.0.1"
      GF_SERVER_HTTP_PORT: "3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboard:/var/lib/grafana/dashboards:ro

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  clickhouse_data:
  kafka_data:
  s3_data:
